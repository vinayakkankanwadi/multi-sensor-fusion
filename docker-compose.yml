# multi-sensor-fusion — top-level compose.
#
# All services on host networking so they can reach the LAN (router, TAK
# Server, Windows BSI Flex if present) and each other via localhost without
# docker-bridge NAT.
#
#   ui             FastAPI UI at http://localhost:8080 — template-driven
#                  SAPIENT v2 sender, treated as one edge node; defaults
#                  its target to Apex on 127.0.0.1:5020.
#   gps            NMEA-over-UDP aggregator. Owns UDP/8500, exposes the
#                  latest GPS fix over HTTP at :8090/gps/current.
#   ntp            Multi-source NTP probe. Exposes the voted
#                  offset/severity at :8091/ntp/current.
#   nodes          Unified registry + status for every named platform
#                  resource. :8093/nodes/current.
#   apex           Real SAPIENT middleware (Python, Trio-based).
#                  Child :5020 (v2), :5010 (v1), :5000 (XML). REST :8081.
#                  Parent forwardAll outbound to cot-bridge (5005) + BSI.
#   cot-bridge     SAPIENT → CoT → TAK fan-out. SAPIENT TCP :5005,
#                  HTTP /health + /stats :8092, UDP-sends CoT to TAK.
#
# Libraries (libs/<lib>/) are pip-installed into each service that
# declares them as additional_contexts. The SAPIENT proto bindings are
# generated on demand into libs/sapient-proto-to-msg/sapient_msg/ via
#   python libs/sapient-proto-to-msg/sapient_proto_to_msg.py
# (also wired into scripts/build.sh). They're not a pip package — each
# consumer COPYs sapient_msg/ directly. No special compose service for
# proto generation.
#
# Run from this directory:
#   docker compose build
#   docker compose up -d
#   docker compose down
#
# Tests are part of the stack — `regression` is a long-running HTTP
# service (FastAPI on :8094). Trigger from the UI's Tests drawer, or:
#   docker compose exec regression pytest /work/tests   # ad-hoc CLI run
#   curl -X POST http://127.0.0.1:8094/run               # via HTTP

# Pin the compose project name so commands run from inside the UI
# container (where the bind-mounted /work parents to a different basename
# than the host's project dir) operate on the SAME set of containers as
# `docker compose` invoked from the host.
name: multi-sensor-fusion

services:

  ui:
    build:
      context: ./services/ui
      dockerfile: Dockerfile
      additional_contexts:
        sapient-proto-to-msg: ./libs/sapient-proto-to-msg
        sapient-encode-decode-msg: ./libs/sapient-encode-decode-msg
    image: ui:latest
    container_name: ui
    network_mode: host
    environment:
      # GPS, NTP, and the unified nodes service each live in their own
      # container; UI polls over HTTP rather than owning any of them
      # directly. /api/middlewares is now a filtered view of /api/nodes
      # (no separate URL — same service, ?type=middleware).
      GPS_URL:        "http://127.0.0.1:8090"
      NTP_URL:        "http://127.0.0.1:8091"
      NODES_URL:      "http://127.0.0.1:8093"
      REGRESSION_URL: "http://127.0.0.1:8094"
      # Propagate the host's X11 cookies into the UI container so that
      # when the backend shells out to `docker compose up apex-gui`, the
      # apex-gui service inherits the right DISPLAY and can draw on the
      # operator's desktop. WAYLAND_DISPLAY covers Wayland sessions.
      DISPLAY:         "${DISPLAY:-}"
      WAYLAND_DISPLAY: "${WAYLAND_DISPLAY:-}"
      XAUTHORITY:      "${XAUTHORITY:-}"
      # The backend uses this to point `docker compose --project-directory`
      # at the SAME absolute path the host uses, so bind-mount paths in
      # this compose file resolve identically from both contexts. PWD
      # is needed because the compose file uses ${PWD}-style interpolation
      # in volume specs, which compose reads from the calling shell's env.
      PROJECT_DIR:     "${PWD}"
      PWD:             "${PWD}"
    volumes:
      - ./services/ui/data:/app/data
      # Read view onto Apex's archive — backs /api/apex/state. Same dir
      # Apex writes to; SQLite WAL mode touches lock files even on read,
      # so this can't be :ro.
      - ./services/apex/data:/app/apex-archive
      # Docker access from the UI backend: lets /api/apex/gui/* and
      # /api/apex/sqlite/* shell out to `docker compose` against the host
      # daemon. Mount the host project root at the SAME absolute path
      # inside the container so bind-mount paths in this compose file
      # (e.g. ./services/apex/data) resolve identically whether compose
      # is run from the host or from inside this container.
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PWD}:${PWD}:ro
    restart: unless-stopped

  gps:
    # NMEA-over-UDP aggregator. Owns UDP/NMEA_PORT (default 8500) and
    # exposes the latest fix to other services over HTTP. Single source of
    # truth for "what does the platform think its GPS position is" — the
    # UI, fusion node, and any future consumer all read /gps/current here.
    build:
      context: ./services/gps
      dockerfile: Dockerfile
    image: gps:latest
    container_name: gps
    network_mode: host
    environment:
      NMEA_BIND: "0.0.0.0"
      NMEA_PORT: "8500"
    restart: unless-stopped

  ntp:
    # Multi-source NTP probe. Polls every server in NTP_SERVERS on a
    # fixed cadence and exposes the voted offset/severity at /ntp/current.
    # Centralises the cadence (no N consumers × M servers fan-out) and
    # gives us one canonical "what's our clock drift" answer.
    build:
      context: ./services/ntp
      dockerfile: Dockerfile
    image: ntp:latest
    container_name: ntp
    network_mode: host
    environment:
      NTP_SERVERS:   "192.168.201.1,pool.ntp.org"
      NTP_INTERVAL_S: "30"
      NTP_TIMEOUT_S:  "2"
    restart: unless-stopped

  nodes:
    # Unified registry + status service for every named resource on the
    # platform: the router (type=platform-node, NTP+GPS aggregator), SAPIENT
    # endpoints (type=middleware, TCP probe), and any future type plug-in
    # (type=tak-server, =edge-node, =fusion-node, …). Replaces the old
    # split into nodes + middlewares; both now sit under
    # deprecated/. The UI's two drawers consume filtered views of the
    # same /nodes/current endpoint.
    build:
      context: ./services/nodes
      dockerfile: Dockerfile
    image: nodes:latest
    container_name: nodes
    network_mode: host
    environment:
      NODES_CONFIG:     "/app/config/nodes.json"
      # Default 60s — gentle enough that SAPIENT endpoints don't log each
      # bare TCP-connect-then-close as a receiver error. Override at will.
      NODES_INTERVAL_S: "60"
      NTP_URL:          "http://127.0.0.1:8091"
      GPS_URL:          "http://127.0.0.1:8090"
    volumes:
      # Live-edit the node list without rebuilding the image. Read-write
      # so PATCH /nodes/{id} can persist host/port/probe changes typed
      # in the UI back to the file on disk.
      - ./services/nodes/config/nodes.json:/app/config/nodes.json
    restart: unless-stopped

  apex:
    build:
      context: ./services/apex
      dockerfile: Dockerfile
      additional_contexts:
        apex-src: ./dstl/Apex-SAPIENT-Middleware
    image: apex:latest
    container_name: apex
    network_mode: host
    volumes:
      # Live-edit the LAN config without rebuilding the image.
      - ./services/apex/apex_config.json:/app/apex_config.json:ro
      # Persist Apex's SQLite archive (every routed message + connection
      # log) on the host so it survives container rebuilds and can be
      # opened with sqlite3 / DB Browser or replayed via apex-replay.
      - ./services/apex/data:/app/data
    restart: unless-stopped

  # Opt-in: replays a stored SAPIENT .sqlite archive over TCP into Apex's
  # Child port (:5020). Not started by default. Run with:
  #     docker compose --profile replay run --rm apex-replay
  # Replay config lives in services/apex/data/replay_config.json (the
  # bind-mounted data dir). Apex ships an example replay_config.json
  # baked into the image at /app/replay_config.json — drop a copy into
  # services/apex/data/ and edit it for your DB file / time window /
  # speed multiplier.
  apex-replay:
    profiles: ["replay"]
    image: apex:latest
    container_name: apex-replay
    network_mode: host
    command: ["python", "-m", "sapient_apex_replay.replay",
              "/app/data/replay_config.json"]
    volumes:
      # RW mount required: SQLite WAL mode needs to touch -shm/-wal lock
      # files even when only reading. Replay performs no INSERTs.
      - ./services/apex/data:/app/data
    depends_on:
      - apex

  # Opt-in: web-based SQLite browser over Apex's archive. Triggered
  # by the "Open Apex SQLite" button in the Nodes drawer's Apex panel
  # (which POSTs /api/apex/sqlite/start). Read-only mount so operators
  # can browse and query without risk of mutating Apex's archive.
  #
  # Also runnable from the CLI:
  #     docker compose --profile sqlite-ui up -d apex-sqlite-web
  # then http://localhost:8095
  apex-sqlite-web:
    profiles: ["sqlite-ui"]
    image: coleifer/sqlite-web:latest
    container_name: apex-sqlite-web
    network_mode: host
    # Resolve "latest" at container start (filenames sort by timestamp).
    # This means rolling over to a new day's archive requires a container
    # restart to pick up the new file — operator clicks Stop / Open again.
    entrypoint: ["sh", "-c"]
    command:
      - 'exec sqlite_web --host 0.0.0.0 --port 8095 --read-only --no-browser
         "$$(ls /data/data-*.sqlite | tail -1)"'
    volumes:
      - ./services/apex/data:/data:ro
    restart: unless-stopped

  # Opt-in: Apex's Qt6 desktop GUI (database/connection/message viewer).
  # Same image as the middleware, different entry point. Forwards the
  # host's X11 socket so the window opens on your desktop. Run with:
  #     docker compose --profile gui up apex-gui
  # On Wayland sessions, set QT_QPA_PLATFORM=wayland in env first.
  apex-gui:
    profiles: ["gui"]
    image: apex:latest
    container_name: apex-gui
    network_mode: host
    command: ["python", "-m", "sapient_apex_gui.apex_gui"]
    environment:
      DISPLAY:         "${DISPLAY}"
      WAYLAND_DISPLAY: "${WAYLAND_DISPLAY:-}"
      QT_QPA_PLATFORM: "${QT_QPA_PLATFORM:-xcb}"
      XAUTHORITY:      "/root/.Xauthority"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/root/.Xauthority:ro
      # Bind apex archive read-write (SQLite WAL needs lock files even
      # for read-only opens). GUI does SELECTs only.
      - ./services/apex/data:/app/data
    depends_on:
      - apex

  cot-bridge:
    # SAPIENT → CoT → TAK fan-out. Accepts SAPIENT TCP on :5005 (same wire
    # as Apex/BSI), converts via sapient_msg_to_cot, UDP-sends CoT to TAK.
    # Wired up as one of Apex's outbound Parent forwardAll targets (see
    # apex/apex_config.json → 127.0.0.1:5005). Still launchable standalone
    # for direct-feed testing — point any SAPIENT producer at :5005.
    build:
      context: ./services/cot-bridge
      dockerfile: Dockerfile
      additional_contexts:
        sapient-proto-to-msg: ./libs/sapient-proto-to-msg
        sapient-encode-decode-msg: ./libs/sapient-encode-decode-msg
        sapient-msg-to-cot:   ./libs/sapient-msg-to-cot
    image: cot-bridge:latest
    container_name: cot-bridge
    network_mode: host
    environment:
      COT_BRIDGE_BIND:  "0.0.0.0"
      COT_BRIDGE_PORT:  "5005"
      TAK_HOST:         "192.168.201.222"
      TAK_PORT:         "6969"
      # Fallback position for SAPIENT messages without a Location (e.g.
      # Registration). Pick a sensible Brisbane reference. Once GPS is
      # wired in, this becomes a last-resort default.
      FALLBACK_LAT:     "-27.4698"
      FALLBACK_LON:     "153.0251"
      FALLBACK_ALT:     "27.0"
    restart: unless-stopped

  regression:
    # Long-running HTTP wrapper around pytest. Exposes /health, /run,
    # /status, /result on :8094. The UI's Tests drawer drives it from
    # the browser; CLI users can `docker compose exec regression pytest
    # /work/tests` or `curl -X POST http://127.0.0.1:8094/run`.
    #
    # Same image still runs the underlying test suite — the runtime
    # difference is only that uvicorn is the entrypoint now.
    build:
      context: ./tests
      dockerfile: Dockerfile
      additional_contexts:
        # libs-root is the WHOLE libs/ tree — every lib with a
        # pyproject.toml gets pip-installed automatically. Adding a new
        # pip-installable lib does not require editing this file or
        # the Dockerfile.
        libs-root:            ./libs
        # sapient-proto-to-msg has no pyproject.toml — its output folder
        # (sapient_msg/) is generated on demand and COPYed onto
        # PYTHONPATH directly, same as any consuming service.
        sapient-proto-to-msg: ./libs/sapient-proto-to-msg
    image: regression:latest
    container_name: regression
    network_mode: host
    restart: unless-stopped
