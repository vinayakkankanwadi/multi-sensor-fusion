# multi-sensor-fusion — top-level compose.
#
# All services on host networking so they can reach the LAN (router, TAK
# Server, Windows BSI Flex if present) and each other via localhost without
# docker-bridge NAT.
#
#   sapient-proto  Build-only image holding the generated Python bindings
#                  for SAPIENT BSI Flex 335 v2. Built once, consumed by ui
#                  and cot-bridge at *their* build time. Sits behind the
#                  "proto-build" profile so it doesn't appear under up/ps.
#                  Use `scripts/build.sh` (or `compose --profile proto-build
#                  build sapient-proto`) to (re)build it.
#   ui             FastAPI UI at http://localhost:8080 — template-driven
#                  SAPIENT v2 sender, treated as one edge node; defaults
#                  its target to Apex on 127.0.0.1:5020.
#   gps            NMEA-over-UDP aggregator. Owns UDP/8500, exposes the
#                  latest GPS fix over HTTP at :8090/gps/current. Single
#                  source of truth for platform position.
#   ntp            Multi-source NTP probe. Polls every server in
#                  MSF_NTP_SERVERS, exposes the voted offset/severity at
#                  :8091/ntp/current.
#   nodes          Platform-node registry + status aggregator. A "node"
#                  is an upstream host that provides services (NTP, GPS,
#                  …); this service rolls per-service health into one
#                  green/yellow/red per node at :8093/nodes/current.
#   middlewares    Registry + status prober for SAPIENT middlewares.
#                  Mounted JSON config defines the list; TCP-probes each
#                  on a cadence; exposes list+status at :8092/middlewares/current.
#   apex           Real SAPIENT middleware (Python, Trio-based).
#                  Child ports 5020/5010/5000, Peer 5001, Recorder 5003,
#                  Parent forwardAll 5004, REST API 8081.
#                  Outbound Parent forwardAll to cot-bridge (5005) and to
#                  the Windows BSI Flex harness on the LAN if present.
#   cot-bridge     SAPIENT → CoT → TAK fan-out. Accepts SAPIENT TCP on
#                  5005, UDP-sends CoT XML to MSF_TAK_HOST:MSF_TAK_PORT.
#
# Run from this directory:
#   ./scripts/build.sh           # builds proto bindings + every service
#   docker compose up -d
#   docker compose down

services:

  sapient-proto:
    # Build-only: scratch image holding /sapient_msg with generated v2
    # bindings. ui and cot-bridge COPY from it during their own builds,
    # so the protoc recipe lives in exactly one Dockerfile.
    profiles: ["proto-build"]
    build:
      context: ./libs/sapient-proto
      additional_contexts:
        proto-src: ./SAPIENT-Proto-Files
    image: msf-sapient-proto:latest

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      additional_contexts:
        proto-bindings: docker-image://msf-sapient-proto:latest
        sapient-wire:   ./libs/sapient-wire
    image: msf-ui:latest
    container_name: msf-ui
    network_mode: host
    environment:
      # NTP / GPS / middlewares / nodes each live in their own service;
      # UI polls over HTTP rather than owning any of them directly.
      MSF_GPS_URL:         "http://127.0.0.1:8090"
      MSF_NTP_URL:         "http://127.0.0.1:8091"
      MSF_MIDDLEWARES_URL: "http://127.0.0.1:8092"
      MSF_NODES_URL:       "http://127.0.0.1:8093"
    volumes:
      - ./ui/templates:/app/templates
      - ./ui/runs:/app/runs
    restart: unless-stopped

  gps:
    # NMEA-over-UDP aggregator. Owns UDP/MSF_NMEA_PORT (default 8500) and
    # exposes the latest fix to other services over HTTP. Single source of
    # truth for "what does the platform think its GPS position is" — the
    # UI, fusion node, and any future consumer all read /gps/current here.
    build:
      context: ./gps
      dockerfile: Dockerfile
    image: msf-gps:latest
    container_name: msf-gps
    network_mode: host
    environment:
      MSF_NMEA_BIND: "0.0.0.0"
      MSF_NMEA_PORT: "8500"
    restart: unless-stopped

  ntp:
    # Multi-source NTP probe. Polls every server in MSF_NTP_SERVERS on a
    # fixed cadence and exposes the voted offset/severity at /ntp/current.
    # Centralises the cadence (no N consumers × M servers fan-out) and
    # gives us one canonical "what's our clock drift" answer.
    build:
      context: ./ntp
      dockerfile: Dockerfile
    image: msf-ntp:latest
    container_name: msf-ntp
    network_mode: host
    environment:
      MSF_NTP_SERVERS:   "192.168.201.1,pool.ntp.org"
      MSF_NTP_INTERVAL_S: "30"
      MSF_NTP_TIMEOUT_S:  "2"
    restart: unless-stopped

  nodes:
    # Registry + status aggregator for platform "nodes" — upstream hosts
    # that provide services to the rest of the stack (NTP, GPS, …). Owns
    # no data; periodically pulls msf-ntp's /ntp/sources and msf-gps's
    # /gps/current and composes a per-node severity ("ok" iff every
    # enabled service is "ok"). Exposes the list at :8093/nodes/current.
    build:
      context: ./nodes
      dockerfile: Dockerfile
    image: msf-nodes:latest
    container_name: msf-nodes
    network_mode: host
    environment:
      MSF_NODES_CONFIG:     "/app/config/nodes.json"
      MSF_NODES_INTERVAL_S: "10"
      MSF_NTP_URL:          "http://127.0.0.1:8091"
      MSF_GPS_URL:          "http://127.0.0.1:8090"
    volumes:
      # Live-edit the node list without rebuilding.
      - ./nodes/config/nodes.json:/app/config/nodes.json:ro
    restart: unless-stopped

  middlewares:
    # Registry + status prober for SAPIENT middlewares. Reads its list
    # from a mounted JSON config (live-editable without rebuild) and
    # TCP-probes each entry on a fixed cadence. Exposes the list + live
    # statuses at :8092/middlewares/current. Single source of truth for
    # "which middleware can I talk to right now" — consumed by the UI
    # picker and any future dashboards.
    build:
      context: ./middlewares
      dockerfile: Dockerfile
    image: msf-middlewares:latest
    container_name: msf-middlewares
    network_mode: host
    environment:
      MSF_MIDDLEWARES_CONFIG:      "/app/config/middlewares.json"
      # Probe each middleware once a minute. Anything faster makes SAPIENT
      # middlewares log a "Connection closed" error on every round (our
      # bare TCP-connect-then-close looks like an aborted ASM session),
      # which generates noise that drowns out real events. Per-entry
      # "probe": false in the config skips a middleware entirely.
      MSF_MIDDLEWARES_INTERVAL_S:   "60"
      MSF_MIDDLEWARES_TIMEOUT_S:    "1.5"
      MSF_MIDDLEWARES_WARN_AFTER_S: "0.5"
    volumes:
      # Live-edit the middleware list without rebuilding the image. Read-write
      # so PATCH /middlewares/{id} can persist host/port changes typed in the
      # UI back to the file on disk.
      - ./middlewares/config/middlewares.json:/app/config/middlewares.json
    restart: unless-stopped

  apex:
    build:
      context: ./apex
      dockerfile: Dockerfile
      additional_contexts:
        apex-src: ./Apex-SAPIENT-Middleware
    image: msf-apex:latest
    container_name: msf-apex
    network_mode: host
    volumes:
      # Live-edit the LAN config without rebuilding the image.
      - ./apex/apex_config.json:/app/apex_config.json:ro
    restart: unless-stopped

  cot-bridge:
    # SAPIENT → CoT → TAK fan-out. Accepts SAPIENT TCP on :5005 (same wire
    # as Apex/BSI), converts via sapient_to_cot, UDP-sends CoT to TAK.
    # Wired up as one of Apex's outbound Parent forwardAll targets (see
    # apex/apex_config.json → 127.0.0.1:5005). Still launchable standalone
    # for direct-feed testing — point any SAPIENT producer at :5005.
    build:
      context: ./cot-bridge
      dockerfile: Dockerfile
      additional_contexts:
        proto-bindings: docker-image://msf-sapient-proto:latest
        sapient-wire:   ./libs/sapient-wire
        sapient-to-cot: ./libs/sapient-to-cot
    image: msf-cot-bridge:latest
    container_name: msf-cot-bridge
    network_mode: host
    environment:
      MSF_COT_BRIDGE_BIND:  "0.0.0.0"
      MSF_COT_BRIDGE_PORT:  "5005"
      MSF_TAK_HOST:         "192.168.201.222"
      MSF_TAK_PORT:         "6969"
      # Fallback position for SAPIENT messages without a Location (e.g.
      # Registration). Pick a sensible Brisbane reference. Once GPS is
      # wired in, this becomes a last-resort default.
      MSF_FALLBACK_LAT:     "-27.4698"
      MSF_FALLBACK_LON:     "153.0251"
      MSF_FALLBACK_ALT:     "27.0"
    restart: unless-stopped
