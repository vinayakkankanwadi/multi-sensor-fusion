# multi-sensor-fusion — top-level compose.
#
# All services on host networking so they can reach the LAN (router, TAK
# Server, Windows BSI Flex if present) and each other via localhost without
# docker-bridge NAT.
#
#   ui          FastAPI UI at http://localhost:8080
#               (template-driven SAPIENT v2 sender, treated as one edge node;
#                defaults its target to Apex on 127.0.0.1:5020).
#   apex        Real SAPIENT middleware (Python, Trio-based).
#               Child ports 5020/5010/5000, Peer 5001, Recorder 5003,
#               Parent forwardAll 5004, REST API 8081.
#               Outbound Parent forwardAll to cot-bridge (5005) and to the
#               Windows BSI Flex harness on the LAN if present.
#   cot-bridge  Standalone SAPIENT → CoT → TAK fan-out. Accepts SAPIENT TCP
#               on 5005, UDP-sends CoT XML to MSF_TAK_HOST:MSF_TAK_PORT.
#
# Run from this directory:
#   docker compose build
#   docker compose up -d
#   docker compose down

services:

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
      additional_contexts:
        proto-src: ./SAPIENT-Proto-Files
    image: msf-ui:latest
    container_name: msf-ui
    network_mode: host
    environment:
      MSF_NTP_SERVER:      "192.168.201.1"
      MSF_NMEA_BIND:       "0.0.0.0"
      MSF_NMEA_PORT:       "8500"
    volumes:
      - ./ui/templates:/app/templates
      - ./ui/runs:/app/runs
    restart: unless-stopped

  apex:
    build:
      context: ./apex
      dockerfile: Dockerfile
      additional_contexts:
        apex-src: ./Apex-SAPIENT-Middleware
    image: msf-apex:latest
    container_name: msf-apex
    network_mode: host
    volumes:
      # Live-edit the LAN config without rebuilding the image.
      - ./apex/apex_config.json:/app/apex_config.json:ro
    restart: unless-stopped

  cot-bridge:
    # Standalone SAPIENT → CoT → TAK service. Accepts SAPIENT TCP on :5005
    # (same wire as Apex/BSI), converts via sapient_to_cot, fan-outs to TAK
    # over UDP. Not yet plugged into Apex; runs in isolation for testing.
    build:
      context: ./cot-bridge
      dockerfile: Dockerfile
      additional_contexts:
        proto-src: ./SAPIENT-Proto-Files
        sapient-to-cot: ./sapient-to-cot
    image: msf-cot-bridge:latest
    container_name: msf-cot-bridge
    network_mode: host
    environment:
      MSF_COT_BRIDGE_BIND:  "0.0.0.0"
      MSF_COT_BRIDGE_PORT:  "5005"
      MSF_TAK_HOST:         "192.168.201.222"
      MSF_TAK_PORT:         "6969"
      # Fallback position for SAPIENT messages without a Location (e.g.
      # Registration). Pick a sensible Brisbane reference. Once GPS is
      # wired in, this becomes a last-resort default.
      MSF_FALLBACK_LAT:     "-27.4698"
      MSF_FALLBACK_LON:     "153.0251"
      MSF_FALLBACK_ALT:     "27.0"
    restart: unless-stopped
