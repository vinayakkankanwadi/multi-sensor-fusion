[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sapient-msg-to-cot"
version = "0.1.0"
description = "Convert SAPIENT BSI Flex 335 v2 protobuf messages into Cursor-on-Target XML events."
requires-python = ">=3.10"
dependencies = ["protobuf>=4.25,<5"]

# Single-file module — declares itself, no package directory.
[tool.setuptools]
py-modules = ["sapient_msg_to_cot"]
